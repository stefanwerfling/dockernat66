[package]
name = "docker-nat66"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mini NAT66 gateway for Docker: masquerades the IPv6 (ULA) Docker bridge networks over the host's WAN interface via nftables (own netlink encoder, no external tools)."
publish = false

[[bin]]
name = "docker-nat66"
path = "src/main.rs"

[dependencies]
libc = "0.2"

serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
